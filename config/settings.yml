project:
  name: cfb-weather-totals
  timezone: America/Chicago

data:
  start_year: 2014
  end_year: 2025
  season_type: regular
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs

cfbd:
  base_url: https://api.collegefootballdata.com
  preferred_line_providers:
    - consensus
    - DraftKings
    - Bovada
    - Caesars
    - BetMGM

modeling:
  target: market_residual
  min_games_for_group: 25

weekly:
  paper_tracking_only: true
  run_day_note: Official 2026 regular-season prospective snapshots run Thursday/Friday 5:17 and 8:17 AM Central, Saturday 1:17 AM Central, plus Tuesday/Wednesday 5:17 and 8:17 AM Central in November. Monday remains an operational early look. The public live board rolls to postseason after no future regular-season games remain and maps January/February games back to the prior CFB season.
