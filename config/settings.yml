project:
  name: cfb-weather-totals
  timezone: America/Chicago

data:
  start_year: 2014
  end_year: 2025
  season_type: regular
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs

cfbd:
  base_url: https://api.collegefootballdata.com
  preferred_line_providers:
    - consensus
    - DraftKings
    - Bovada
    - Caesars
    - BetMGM

modeling:
  target: market_residual
  min_games_for_group: 25

weekly:
  paper_tracking_only: true
  run_day_note: Official 2026 prospective board snapshots run Thursday 14Z, Friday 14Z, and Saturday 13Z; other refreshes are non-official.
