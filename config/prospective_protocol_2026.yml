protocol_version: "2026.3"
season: 2026
frozen_at_utc: "2026-08-28T00:38:00Z"
revision_effective_at_utc: "2026-09-04T05:00:00Z"
supersedes: "2026.2"
revision_scope: "Official board scheduling reliability and watchdog automation only; model rules, qualifier thresholds, grading, closing-benchmark policy, and card logic are unchanged. The revised eligible schedules apply prospectively."
purpose: "Prospective paper validation of the frozen 2026 CFB totals research rules."

rules:
  general:
    model_track: "GENERAL HGB"
    direction: "under"
    qualify_edge_points: 3.5
    minimum_total: 56.0
  fcs:
    model_track: "FCS-only HGB"
    direction: "under"
    qualify_edge_points: 7.5
    minimum_total: 56.0

official_entry_policy:
  eligible_event_name: "schedule"
  eligible_crons:
    - "17 10 * * 4,5"
    - "17 11 * * 4,5"
    - "17 13 * * 4,5"
    - "17 14 * * 4,5"
    - "17 7 * * 6"
    - "17 8 * * 6"
    - "17 11 * * 6"
    - "17 12 * * 6"
  minimum_lead_minutes: 120
  selection: "For each game, use the latest successful eligible scheduled snapshot at least 120 minutes before kickoff. The active CDT or CST expression is selected by the workflow's America/Chicago gate. For duplicate attempts of the same GitHub run, retain the earliest successful attempt. Manual, push-triggered, and watchdog-dispatched refreshes are archived but are never official entries."

schedule_reliability:
  timezone: "America/Chicago"
  monday_early_look_local: "05:17"
  thursday_friday_safety_local: "05:17"
  thursday_friday_freshness_local: "08:17"
  saturday_safety_local: "02:17"
  saturday_freshness_local: "06:17"
  watchdog_delay_minutes: 30
  watchdog_policy: "A separate scheduled workflow checks for a successful safety build and dispatches an operational workflow_dispatch backup when none exists. The backup keeps the live board current but is intentionally ineligible for official prospective entry."

closing_benchmark_policy:
  capture_event_name: "schedule"
  capture_crons:
    - "15,45 14-23 * * 4,5,6,0,1"
    - "15,45 0-5 * * 5,6,0,1,2"
  capture_window_minutes: 90
  allow_manual_capture: false
  allow_rerun_backfill: false
  selection: "Use the latest immutable first-attempt scheduled market capture before kickoff and within the 90-minute capture window. Beginning with protocol 2026.2, the capture workflow attempts twice per hour to reduce missed benchmarks caused by delayed GitHub scheduled jobs. Prefer the median total across available books; if a median is unavailable, use the selected current total. Missing captures stay missing and are not manually backfilled."
  clv_definition: "For an under, CLV points = entry total minus benchmark close total. Positive is favorable. For an over, CLV points = benchmark close total minus entry total."

paper_grading:
  price: -110
  qualifying_status: "QUALIFIES"
  unit_stake: 1.0
  win_profit_units: 0.9090909091
  loss_profit_units: -1.0
  push_profit_units: 0.0
  postgame_grade_crons:
    - "0 12 * * 0,1,2"
  timing_note: "Derived grades are rebuilt only on postgame mornings or the scheduled pregame model runs, not during the live-game capture window."

freeze_policy:
  description: "Do not tune production thresholds or retrospectively alter official-entry selection based on 2026 outcomes before the declared review point. Protocol 2026.3 changes only future scheduled snapshot timing and operational backup reliability after documented GitHub schedule delays. Any future protocol change must receive a new protocol_version and applies prospectively only from its declared effective time."
  review_point: "After the 2026 regular season unless a data-integrity bug requires a documented correction."
