name: Market Source Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Summarize current live market coverage
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          rows = list(csv.DictReader(open('outputs/weekly_board.csv', newline='', encoding='utf-8')))
          print('Total board rows:', len(rows))
          for track in sorted(set(r.get('division_track','') for r in rows)):
              group = [r for r in rows if r.get('division_track','') == track]
              live = [r for r in group if r.get('line_cache_status') == 'LIVE' and r.get('closing_total')]
              cached = [r for r in group if r.get('line_cache_status') == 'CACHED' and r.get('closing_total')]
              no_line = [r for r in group if not r.get('closing_total')]
              print(f'{track or "blank"}: rows={len(group)} live={len(live)} cached={len(cached)} no_line={len(no_line)}')
          fbsfbs = [r for r in rows if r.get('fbs_vs_fbs','').lower() == 'true']
          print('FBS-vs-FBS:', len(fbsfbs), 'with total:', sum(bool(r.get('closing_total')) for r in fbsfbs), 'live:', sum(r.get('line_cache_status') == 'LIVE' and bool(r.get('closing_total')) for r in fbsfbs))
          mixed = [r for r in rows if {r.get('home_classification','').lower(), r.get('away_classification','').lower()} == {'fbs','fcs'}]
          print('FBS-vs-FCS mixed:', len(mixed), 'with total:', sum(bool(r.get('closing_total')) for r in mixed), 'live:', sum(r.get('line_cache_status') == 'LIVE' and bool(r.get('closing_total')) for r in mixed))
          print('No-line FBS-vs-FBS:')
          for r in fbsfbs:
              if not r.get('closing_total'):
                  print(' ', r.get('away_team'), '@', r.get('home_team'))
          print('No-line FBS-vs-FCS mixed:')
          for r in mixed:
              if not r.get('closing_total'):
                  print(' ', r.get('away_team'), '@', r.get('home_team'))
          PY
