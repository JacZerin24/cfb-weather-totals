name: Market Source Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/market-source-diagnostic.yml'

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production board refresh after final FCS alias repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run weekly-cfb-weather.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Triggered final Weekly CFB Weather Totals validation on main."
