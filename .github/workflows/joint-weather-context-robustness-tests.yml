name: Validate Joint Core Robustness Research

on:
  pull_request:
    paths:
      - 'src/joint_weather_context_robustness.py'
      - 'src/joint_weather_context_robustness_selftest.py'
      - '.github/workflows/joint-weather-context-robustness-tests.yml'
      - '.github/workflows/manual-joint-weather-context-robustness.yml'
      - 'documentation/JOINT_WEATHER_CONTEXT_ROBUSTNESS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run synthetic joint-core robustness validation
        run: python -m src.joint_weather_context_robustness_selftest
