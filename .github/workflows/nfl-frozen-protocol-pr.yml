name: Validate Frozen NFL Protocol

on:
  pull_request:
    paths:
      - 'config/nfl_frozen_protocol.yml'
      - 'config/nfl_settings.yml'
      - 'documentation/NFL_FROZEN_PROTOCOL.md'
      - 'src/nfl/validate_frozen_protocol.py'
      - '.github/workflows/nfl-frozen-protocol-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate frozen NFL protocol
        run: python -m src.nfl.validate_frozen_protocol
