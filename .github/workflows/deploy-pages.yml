name: Deploy CFB Weather Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_run:
    workflows:
      - Manual Historical Research Run
      - Site UI Weather Tools
      - Weekly CFB Weather Totals
      - Rebuild Prospective Results
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Verify that a real source build completed
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SOURCE_CONCLUSION" != "success" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SOURCE_WORKFLOW" = "Manual Historical Research Run" ] || [ "$SOURCE_WORKFLOW" = "Site UI Weather Tools" ] || [ "$SOURCE_WORKFLOW" = "Weekly CFB Weather Totals" ] || [ "$SOURCE_WORKFLOW" = "Rebuild Prospective Results" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: verify-source
    if: needs.verify-source.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify website artifact contains required production UI
        run: |
          set -euo pipefail
          test -s docs/index.html
          grep -q 'SITE_WEATHER_TOOLS' docs/index.html
          grep -q 'SITE_RADAR_SYNC' docs/index.html
          grep -q 'id="radarToggle"' docs/index.html
          grep -q 'id="weatherFilter"' docs/index.html
          grep -q 'data-weather-sort="2"' docs/index.html

      # Website-only presentation. Does not modify the forecasting or grading workflows
      # or commit derived files to the repository.
      - name: Set up Python for archived website pages
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install website renderer requirements
        run: pip install -r requirements.txt

      - name: Render historical CFB boards in the Pages artifact
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set -euo pipefail
          python -m src.build_week_history
          test -s docs/history/index.html
          grep -q 'id="weekHistorySelect"' docs/index.html
          grep -ql '<th>Final result</th>' docs/history/week-*.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
