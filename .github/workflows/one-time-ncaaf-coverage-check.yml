name: One-Time NCAAF Coverage Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-ncaaf-coverage-check.yml'

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile market source changes
        run: python -m py_compile src/odds_api_fallback.py src/run_live_week.py
      - name: Trigger production validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly-cfb-weather.yml --repo "$GITHUB_REPOSITORY" --ref main
