name: Stadium Wind Orientation Research

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional research note
        required: false
        default: orientation-research
  push:
    branches:
      - stadium-wind-orientation-research
    paths:
      - .github/workflows/stadium-orientation-research.yml

permissions:
  contents: read
  actions: read

jobs:
  orientation-research:
    runs-on: ubuntu-latest

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm required CFBD secret
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "ERROR: CFBD_API_KEY is missing."
            exit 1
          fi

      - name: Restore current historical modeling dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cfb-orientation-base
          mkdir -p /tmp/cfb-orientation-base data/processed
          LIVE_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cfb-live-training-data&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$LIVE_RUN_ID" ]; then
            echo "ERROR: No current live training artifact found."
            exit 1
          fi
          gh run download "$LIVE_RUN_ID" -n cfb-live-training-data -D /tmp/cfb-orientation-base
          cp /tmp/cfb-orientation-base/modeling_dataset.csv data/processed/modeling_dataset.csv
          echo "Restored modeling dataset from run ${LIVE_RUN_ID}."

      - name: Pull locked-regime play-by-play and run final mechanism study
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m src.pull_orientation_play_by_play
          python -m src.stadium_wind_orientation_pbp_mechanism

      - name: Upload orientation mechanism outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stadium-wind-orientation-research
          path: |
            data/raw/orientation_pbp_10_15.csv
            outputs/orientation_research/*
