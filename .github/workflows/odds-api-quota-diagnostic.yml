name: Odds API Quota Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/odds-api-quota-diagnostic.yml'

permissions:
  contents: read

jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Query zero-cost quota headers
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          key = os.environ['ODDS_API_KEY'].strip()
          r = requests.get('https://api.the-odds-api.com/v4/sports/', params={'apiKey': key}, timeout=30)
          print('HTTP', r.status_code)
          print('X_REQUESTS_USED', r.headers.get('x-requests-used'))
          print('X_REQUESTS_REMAINING', r.headers.get('x-requests-remaining'))
          print('X_REQUESTS_LAST', r.headers.get('x-requests-last'))
          r.raise_for_status()
          PY
