name: Validate Bankroll Helper

on:
  pull_request:
    paths:
      - 'src/bankroll_helper.py'
      - 'src/fcs_research_labels.py'
      - '.github/workflows/bankroll-helper-tests.yml'
      - '.github/workflows/weekly-cfb-weather.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate bankroll and FCS label logic
        run: |
          python - <<'PY'
          import pandas as pd
          from src.bankroll_helper import _inject, _qualifier_records, _script, _section_html
          from src.fcs_research_labels import FCS_LABEL, label_html

          board = pd.DataFrame([
              {
                  'game_id': 1, 'status': 'QUALIFIES', 'division_track': 'FBS',
                  'away_team': 'General A', 'home_team': 'General B',
                  'closing_total': 60.0, 'abs_pred_edge': 6.0,
              },
              {
                  'game_id': 2, 'status': 'QUALIFIES', 'division_track': 'OTHER',
                  'away_team': 'General C', 'home_team': 'General D',
                  'closing_total': 58.0, 'abs_pred_edge': 4.0,
              },
              {
                  'game_id': 3, 'status': 'QUALIFIES', 'division_track': 'FCS',
                  'away_team': 'FCS A', 'home_team': 'FCS B',
                  'closing_total': 59.5, 'abs_pred_edge': 8.0,
              },
              {
                  'game_id': 4, 'status': 'LEAN', 'division_track': 'FBS',
                  'away_team': 'Lean A', 'home_team': 'Lean B',
                  'closing_total': 55.0, 'abs_pred_edge': 5.0,
              },
          ])

          general, fcs, card = _qualifier_records(board)
          assert [g['game_id'] for g in general] == ['1', '2']
          assert [g['game_id'] for g in fcs] == ['3']
          assert [g['game_id'] for g in card] == ['1', '2']

          html = '<html><head><style>    .parlay { padding:20px; }</style></head><body><nav><a href="#card">2-leg card</a></nav><main><section id="card">card</section></main></body></html>'
          rendered = _inject(html, _section_html(2, 1, True), _script(general, fcs, card))
          assert 'id="bankroll"' in rendered
          assert 'href="#bankroll"' in rendered
          assert 'FCS research %' in rendered
          assert 'fcs:0.25' in rendered
          assert 'fcs:0.50' in rendered
          assert 'fcsStake * bankrollData.fcs.length' in rendered
          assert 'FCS RESEARCH' in rendered
          assert '$0 suggested' not in rendered
          assert rendered.index('id="bankroll"') < rendered.index('id="card"')

          dashboard = '''<html><head><style>    .parlay { padding:20px; }</style></head><body>
          <article class="target-card"><span class="badge qualifies">QUALIFIES</span><h3>FCS A <span>@</span> FCS B</h3></article>
          <table><tr data-status="QUALIFIES" data-division="FCS"><td><span class="badge qualifies">QUALIFIES</span></td><td>FCS A @ FCS B</td></tr></table>
          <script>const x = escapeHtml(game.status + ' · ' + (game.division || 'OTHER'));</script>
          </body></html>'''
          labeled = label_html(dashboard, board)
          assert labeled.count(FCS_LABEL) >= 3
          assert 'data-status="QUALIFIES" data-division="FCS"' in labeled
          assert 'fcs-research-qualifies' in labeled
          print('Bankroll/FCS label validation passed.')
          PY
