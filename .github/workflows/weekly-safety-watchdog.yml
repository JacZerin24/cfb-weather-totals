name: Guard Weekly CFB Safety Run

on:
  workflow_dispatch:
  # React immediately to a completed full workflow, including a skipped
  # seasonal cron or failed build. This avoids relying solely on delayed cron
  # watchdog ticks to identify a missing usable production run.
  workflow_run:
    workflows: ['Weekly CFB Weather Totals']
    types: [completed]
    branches: [main]
  schedule:
    # Repeated operational recovery checks. All clock times are America/Chicago.
    # Sunday-Friday: 6:07 through 11:07 AM; hard deadline audit at 12:13 PM.
    - cron: '7 11-16 * * 0-5'  # CDT
    - cron: '7 12-17 * * 0-5'  # CST
    - cron: '13 17 * * 0-5'   # CDT noon deadline audit
    - cron: '13 18 * * 0-5'   # CST noon deadline audit
    # Saturday: 3:07 through 7:07 AM; hard deadline audit at 8:13 AM.
    - cron: '7 8-12 * * 6'   # CDT
    - cron: '7 9-13 * * 6'   # CST
    - cron: '13 13 * * 6'   # CDT Saturday deadline audit
    - cron: '13 14 * * 6'   # CST Saturday deadline audit
    # Backup dispatches remain operational-only: workflow_dispatch is NOT
    # official-eligible under the frozen prospective protocol.

permissions:
  actions: write
  contents: read

# Serialize watchdog decisions to avoid two delayed cron ticks both
# dispatching a replacement for the same missing build.
concurrency:
  group: cfb-weather-weekly-watchdog
  queue: max

jobs:
  central-time-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Select the active Central-time watchdog cron
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$EVENT_SCHEDULE" in
            "7 11-16 * * 0-5"|"13 17 * * 0-5"|"7 8-12 * * 6"|"13 13 * * 6")
              EXPECTED_OFFSET="-0500"
              ;;
            "7 12-17 * * 0-5"|"13 18 * * 0-5"|"7 9-13 * * 6"|"13 14 * * 6")
              EXPECTED_OFFSET="-0600"
              ;;
            *)
              echo "::error::Unknown scheduled expression: $EVENT_SCHEDULE"
              exit 1
              ;;
          esac

          CENTRAL_OFFSET=$(TZ=America/Chicago date +%z)
          CENTRAL_DOW=$(TZ=America/Chicago date +%u)
          # Do not reinterpret a cron delayed into a different local day as
          # a watchdog request for the following day's operational build.
          if [[ "$EVENT_SCHEDULE" == *"0-5"* && "$CENTRAL_DOW" == 6 ]] ||
             [[ "$EVENT_SCHEDULE" == *" * 6" && "$CENTRAL_DOW" != 6 ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping delayed watchdog tick for the wrong Central day."
          elif [ "$CENTRAL_OFFSET" = "$EXPECTED_OFFSET" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running watchdog for Central offset $CENTRAL_OFFSET."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping inactive seasonal watchdog cron $EVENT_SCHEDULE."
          fi

  verify-safety-run:
    needs: central-time-gate
    if: needs.central-time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check completion deadline or dispatch operational backup
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: weekly-cfb-weather.yml
        run: |
          set -euo pipefail

          # Resolve both the midnight boundary and actual completed-by
          # deadline in Central time. GitHub "success" alone can mean all
          # production jobs were skipped; only a successful completed paper
          # run AND website deployment count toward this deadline.
          read -r DAY_START_UTC DEADLINE_UTC NOW_UTC DEADLINE_LABEL < <(
            python - <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Chicago"))
          start = now.replace(hour=0, minute=0, second=0, microsecond=0)
          deadline_hour = 8 if now.weekday() == 5 else 12
          deadline = start.replace(hour=deadline_hour)
          fmt = lambda dt: dt.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          print(fmt(start), fmt(deadline), fmt(now), f"{deadline_hour}:00")
          PY
          )

          echo "Checking for CFB build AND deployment completed today by $DEADLINE_LABEL Central."
          echo "Day start: $DAY_START_UTC; deadline: $DEADLINE_UTC; now: $NOW_UTC"

          RUNS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=100")
          mapfile -t CANDIDATE_RUNS < <(
            jq -r --arg start "$DAY_START_UTC" '
              .workflow_runs[]
              | select(.status == "completed" and .conclusion == "success" and .created_at >= $start)
              | .id
            ' <<< "$RUNS_JSON"
          )

          SUCCESSFUL_RUN=""
          for RUN_ID in "${CANDIDATE_RUNS[@]}"; do
            JOBS_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")
            if jq -e --arg deadline "$DEADLINE_UTC" '
              [.jobs[]
                | select(
                    (.name == "weekly-paper-run" or .name == "deploy-site")
                    and .conclusion == "success"
                    and .completed_at != null
                    and .completed_at <= $deadline
                  )
              ] | length == 2
            ' <<< "$JOBS_JSON" >/dev/null; then
              SUCCESSFUL_RUN="$RUN_ID"
              break
            fi
          done

          if [ -n "$SUCCESSFUL_RUN" ]; then
            echo "Deadline satisfied by full build and deployment in run $SUCCESSFUL_RUN."
            {
              echo "### CFB daily deadline"
              echo "A complete build and website deployment finished before $DEADLINE_LABEL Central: [run $SUCCESSFUL_RUN](https://github.com/${GITHUB_REPOSITORY}/actions/runs/$SUCCESSFUL_RUN)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Never report an on-time success for a late run; do not attempt to
          # backfill a deadline with an after-deadline manual dispatch.
          if [[ "$NOW_UTC" > "$DEADLINE_UTC" || "$NOW_UTC" == "$DEADLINE_UTC" ]]; then
            {
              echo "### CFB daily deadline MISSED"
              echo "No complete CFB build **and** site deployment finished before $DEADLINE_LABEL Central."
              echo "Later operational refreshes do not repair the missed deadline or become official prospective entries."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CFB daily deadline missed: no fully completed build and deployment by $DEADLINE_LABEL Central."
            exit 1
          fi

          # If a full run is underway or queued, do not launch a duplicate.
          # The next hourly check verifies actual completion. Serializing this
          # watchdog plus the build's data-write lock avoids overlapping writes.
          ACTIVE_RUN_ID=$(jq -r --arg start "$DAY_START_UTC" '
            [.workflow_runs[]
              | select(
                  (.status == "queued" or .status == "in_progress")
                  and .created_at >= $start
                )
            ]
            | sort_by(.created_at)
            | last
            | .id // empty
          ' <<< "$RUNS_JSON")

          if [ -n "$ACTIVE_RUN_ID" ]; then
            echo "Build $ACTIVE_RUN_ID is active; avoiding a duplicate dispatch."
            {
              echo "### CFB deadline safeguard"
              echo "An active build is being tracked: [run $ACTIVE_RUN_ID](https://github.com/${GITHUB_REPOSITORY}/actions/runs/$ACTIVE_RUN_ID)."
              echo "It must finish and deploy before $DEADLINE_LABEL Central."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "No completed or active CFB build for today's deadline; dispatching operational backup."
          jq -n '{ref: "main", inputs: {watchdog_backup: "true"}}' |
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
              --input -

          {
            echo "### CFB daily deadline safeguard"
            echo "Dispatched a full operational backup after detecting no completed or active build."
            echo "The next watchdog tick will verify its result. The backup remains **ineligible for official prospective entries**."
            echo "Required completion and deployment deadline: $DEADLINE_LABEL Central."
          } >> "$GITHUB_STEP_SUMMARY"
