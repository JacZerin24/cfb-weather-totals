name: Site UI Weather Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'site_tools/**'
      - 'diagnostics/results/**'
      - '.github/workflows/site-ui-weather-tools.yml'

permissions:
  contents: write

# This workflow still commits docs/index.html, so it must serialize with every
# other generated-data/site writer. Using the shared lock prevents a manual or
# path-triggered presentation refresh from colliding with the weekly board,
# close-capture, or prospective writer during pull --rebase / push.
concurrency:
  group: cfb-weather-data-writes
  cancel-in-progress: false

jobs:
  augment-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned project dependencies
        run: pip install -r requirements.txt

      - name: Rebuild presentation-only weather tools from current board
        run: |
          set -euo pipefail
          python site_tools/augment_weather_ui.py
          python site_tools/fix_radar_ui.py
          python site_tools/apply_stale_status.py
          python site_tools/apply_postponement_diagnostics.py
          python -m src.site_smoke_selftest

      - name: Commit website-only update
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/index.html
          git commit -m "Update weather UI and stale-game diagnostics" || echo "No site UI changes to commit"
          git pull --rebase origin main
          git push origin main
