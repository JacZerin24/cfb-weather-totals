name: Site UI Weather Tools

on:
  push:
    branches:
      - main
    paths:
      - 'site_tools/**'
      - 'diagnostics/results/**'
      - '.github/workflows/site-ui-weather-tools.yml'
  workflow_run:
    workflows:
      - Weekly CFB Weather Totals
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cfb-weather-site-ui
  cancel-in-progress: true

jobs:
  augment-site:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Add sortable weather columns and radar overlay
        run: python site_tools/augment_weather_ui.py

      - name: Synchronize radar mosaic tiles
        run: python site_tools/fix_radar_ui.py

      - name: Apply site-only postponed/stale overrides
        run: python site_tools/apply_stale_status.py

      - name: Display updated postponement diagnostics
        run: python site_tools/apply_postponement_diagnostics.py

      - name: Commit website-only update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/index.html
          git commit -m "Update weather UI and stale-game diagnostics" || echo "No site UI changes to commit"
          git pull --rebase origin main
          git push origin main
