name: Deploy NFL Site Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-nfl-site-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: cfb-weather-data-writes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download exact validated NFL site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/nfl-deploy
          mkdir -p /tmp/nfl-deploy
          gh run download 35555379349 \
            -n nfl-live-pipeline-validation \
            -D /tmp/nfl-deploy
          test -f /tmp/nfl-deploy/docs/index.html
          test -f /tmp/nfl-deploy/docs/nfl/index.html

      - name: Publish NFL page and NCAA selector
        run: |
          set -euo pipefail
          mkdir -p docs/nfl
          cp /tmp/nfl-deploy/docs/index.html docs/index.html
          cp /tmp/nfl-deploy/docs/nfl/index.html docs/nfl/index.html

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/index.html docs/nfl/index.html
          git commit -m "Deploy NFL paper-tracking website" || exit 0
          git pull --rebase origin main
          git push origin main
