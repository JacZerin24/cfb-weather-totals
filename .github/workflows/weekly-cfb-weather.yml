name: Weekly CFB Weather Totals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config/**'
      - 'data/processed/**'
      - '.github/workflows/weekly-cfb-weather.yml'
  schedule:
    # Friday morning refresh plus a Saturday morning update closer to most kickoffs.
    - cron: '0 14 * * 5'
    - cron: '0 13 * * 6'

permissions:
  contents: write
  actions: read

concurrency:
  group: weekly-cfb-weather
  cancel-in-progress: true

jobs:
  weekly-paper-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm CFBD API key
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "ERROR: CFBD_API_KEY is missing."
            exit 1
          fi

      - name: Build live weekly board
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NOAA_API_TOKEN: ${{ secrets.NOAA_API_TOKEN }}
        run: |
          python -m src.predict_week
          python -m src.report
          python -m src.build_live_dashboard

      - name: Commit generated website and outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/ docs/
          git commit -m "Update live CFB weather totals board" || echo "No changes to commit"
          git push
