name: Weekly CFB Weather Totals

on:
  workflow_dispatch:
  schedule:
    # Friday 14Z, roughly Friday morning CT depending on daylight saving time.
    - cron: '0 14 * * 5'

jobs:
  weekly-paper-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper-tracking report
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NOAA_API_TOKEN: ${{ secrets.NOAA_API_TOKEN }}
        run: |
          python -m src.predict_week
          python -m src.report

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/
          git commit -m "Update weekly CFB weather totals report" || echo "No changes to commit"
          git push
