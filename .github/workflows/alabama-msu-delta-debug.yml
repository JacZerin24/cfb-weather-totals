name: Alabama MSU Delta Debug
on:
  push:
    paths:
      - '.github/alabama-msu-debug-trigger.txt'
permissions:
  contents: write
  actions: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore production training
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/t data/processed
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cfb-live-training-data&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          gh run download "$RID" -n cfb-live-training-data -D /tmp/t
          cp $(find /tmp/t -name modeling_dataset.csv -print -quit) data/processed/modeling_dataset.csv
          cp $(find /tmp/t -name team_prior_features.csv -print -quit) data/processed/team_prior_features.csv
      - name: Run exact delta attribution
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m src.alabama_msu_delta_debug
      - name: Commit debug outputs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add outputs/alabama_msu_delta_attribution.csv outputs/alabama_msu_delta_summary.csv
          git commit -m "Add Alabama MSU model delta attribution"
          git pull --rebase origin main
          git push origin main
