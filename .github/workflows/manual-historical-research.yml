name: Manual Historical Research Run

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional run note
        required: false
        default: preseason-test

permissions:
  contents: write
  actions: read

jobs:
  historical-research:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm required secrets
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "ERROR: CFBD_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "CFBD_API_KEY is present."

      - name: Pull historical data and run research
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NOAA_API_TOKEN: ${{ secrets.NOAA_API_TOKEN }}
        run: |
          python -m src.pull_historical_games
          python -m src.pull_historical_lines
          python -m src.pull_historical_weather
          python -m src.pull_team_season_stats
          python -m src.pull_team_advanced_stats || echo "Advanced team stats unavailable; continuing."
          python -m src.build_team_features
          python -m src.build_dataset
          python -m src.climate_context_research
          python -m src.research_weather_edges
          python -m src.backtest_totals
          python -m src.deep_research
          python -m src.model_bakeoff
          python -m src.validate_model_edges
          python -m src.combo_backtest
          python -m src.weekly_card_backtest
          python -m src.run_live_week
          python -m src.report
          python -m src.build_research_dashboard
          python -m src.enrich_research_dashboard_explainer
          cp docs/index.html docs/research.html
          python -m src.build_live_dashboard

      - name: Upload data and outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-weather-totals-research-output
          path: |
            data/raw/*.csv
            data/processed/*.csv
            data/reference/stadium_locations.csv
            outputs/*
            docs/*

      - name: Commit small output reports
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/ docs/ data/reference/stadium_locations.csv
          git commit -m "Update historical research outputs" || echo "No changes to commit"
          git push
