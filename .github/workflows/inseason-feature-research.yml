name: In-Season Feature Research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/inseason-feature-research-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: cfb-weather-data-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore production training data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cfb-training
          mkdir -p /tmp/cfb-training data/processed
          LIVE_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cfb-live-training-data&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$LIVE_RUN_ID" ]; then
            echo "ERROR: no cfb-live-training-data artifact is available."
            exit 1
          fi
          gh run download "$LIVE_RUN_ID" -n cfb-live-training-data -D /tmp/cfb-training
          MODEL_PATH=$(find /tmp/cfb-training -type f -name modeling_dataset.csv -print -quit)
          TEAM_PATH=$(find /tmp/cfb-training -type f -name team_prior_features.csv -print -quit)
          test -n "$MODEL_PATH"
          cp "$MODEL_PATH" data/processed/modeling_dataset.csv
          if [ -n "$TEAM_PATH" ]; then
            cp "$TEAM_PATH" data/processed/team_prior_features.csv
          fi

      - name: Build leakage-safe in-season features and compare models
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set -euo pipefail
          python -m src.inseason_feature_research

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-inseason-feature-research
          path: |
            data/processed/team_inseason_advanced_features.csv
            outputs/inseason_feature_experiment.csv
            outputs/inseason_feature_experiment_by_season.csv
            outputs/inseason_feature_experiment.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit research results
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/inseason_feature_experiment.csv outputs/inseason_feature_experiment_by_season.csv outputs/inseason_feature_experiment.md
          git commit -m "Update in-season feature experiment" || echo "No research output changes"
          git pull --rebase origin main
          git push origin main
