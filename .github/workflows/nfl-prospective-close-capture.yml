name: NFL Prospective Near-Kickoff CLV Capture

on:
  schedule:
    # Sep-Jan only. Every scheduled tick is zero-API until an already-official
    # NFL entry is within 105 minutes of kickoff.
    - cron: '15,45 12-23 * 9,10,11,12,1 *'
    - cron: '15,45 0-5 * 9,10,11,12,1 *'

permissions:
  contents: write

concurrency:
  group: nfl-live-paper-board
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate frozen NFL protocol
        run: |
          python -m src.nfl.validate_frozen_protocol
          python -m src.nfl.prospective_ledger validate-protocol
          python -m src.nfl.prospective_ledger verify

      - name: Zero-API CLV capture preflight
        id: preflight
        if: ${{ github.run_attempt == 1 }}
        run: python -m src.nfl.close_capture_gate --window-minutes 105

      - name: Capture immutable near-kickoff NFL market
        if: ${{ github.run_attempt == 1 && steps.preflight.outputs.should_capture == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NFL_PROSPECTIVE_EVENT_NAME: ${{ github.event_name }}
          NFL_PROSPECTIVE_EVENT_SCHEDULE: ${{ github.event.schedule }}
          NFL_PROSPECTIVE_RUN_ID: ${{ github.run_id }}
          NFL_PROSPECTIVE_RUN_ATTEMPT: ${{ github.run_attempt }}
          NFL_PROSPECTIVE_SHA: ${{ github.sha }}
        run: python -m src.nfl.prospective_ledger capture-close

      - name: Commit NFL prospective CLV records
        if: ${{ github.run_attempt == 1 && steps.preflight.outputs.should_capture == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/nfl/prospective/2026/
          git commit -m "Capture prospective NFL market benchmark" || exit 0
          git pull --rebase origin main
          git push origin main
