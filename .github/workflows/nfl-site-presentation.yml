name: Validate and Publish NFL Website Presentation

on:
  pull_request:
    paths:
      - 'src/nfl/build_site.py'
      - 'src/nfl/site_parity.py'
      - 'src/nfl/site_selftest.py'
      - '.github/workflows/nfl-site-presentation.yml'
  push:
    branches:
      - main
    paths:
      - 'src/nfl/build_site.py'
      - 'src/nfl/site_parity.py'
      - 'src/nfl/site_selftest.py'
      - '.github/workflows/nfl-site-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cfb-weather-data-writes
  cancel-in-progress: false

jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild NFL website from checked-in live data
        run: |
          set -euo pipefail
          python -m src.nfl.build_site
          python -m src.nfl.site_selftest

      - name: Upload NFL website preview
        uses: actions/upload-artifact@v4
        with:
          name: nfl-site-presentation
          path: docs/nfl/index.html
          if-no-files-found: error

      - name: Commit rebuilt NFL page
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/nfl/index.html
          git commit -m "Refresh NFL website presentation" || exit 0
          git pull --rebase origin main
          git push origin main

  deploy:
    needs: presentation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify NFL parity artifact before deploy
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s docs/nfl/index.html
          grep -q 'SITE_WEATHER_TOOLS' docs/index.html
          grep -q 'SITE_RADAR_SYNC' docs/index.html
          grep -q 'NFL_SITE_PARITY' docs/nfl/index.html
          grep -q 'id="weekMap"' docs/nfl/index.html
          grep -q 'id="nflBoardTable"' docs/nfl/index.html
          grep -q 'id="radarToggle"' docs/nfl/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
