name: Phase 1 Historical Audit (read-only)

on:
  pull_request:
    paths:
      - 'research/phase1/**'
      - 'documentation/PHASE1_POINT_IN_TIME_AUDIT_2026.md'
      - '.github/workflows/phase1-point-in-time-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase1-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch (read-only)
        uses: actions/checkout@v4
      - name: Set up pinned project Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned repository requirements
        run: pip install -r requirements.txt
      - name: Test decision-time data gates
        run: python -m unittest discover -s research/phase1 -p 'test_*.py' -v
      - name: Retrieve fixed November 7 training artifact (never write to production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase1_training data/processed
          gh run download 42380170001 -n cfb-live-training-data -D /tmp/phase1_training
          cp /tmp/phase1_training/modeling_dataset.csv data/processed/modeling_dataset.csv
          echo 'a2f5a61248afe895e39bde58c5d3f8e7d10ed490095418e45d69ff0bbc7b3678  data/processed/modeling_dataset.csv' | sha256sum -c -
      - name: Reproduce frozen HGB walk-forward baseline
        run: |
          python -m research.phase1.reproduce_baseline --games data/processed/modeling_dataset.csv --out research/phase1/local_results
      - name: Audit source-only decision-time coverage (fail closed)
        run: |
          python -m research.phase1.decision_time_audit --games data/processed/modeling_dataset.csv --out research/phase1/local_results
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('research/phase1/local_results/gate_report.json').read_text())
          assert report['status'] == 'BLOCKED_NO_VERIFIABLE_BETS', report
          assert report['roi_per_stake'] is None, report
          PY
      - name: Upload audit diagnostics (not production outputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-research-diagnostics
          path: research/phase1/local_results/
          retention-days: 14
