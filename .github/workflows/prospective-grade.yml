name: Rebuild Prospective Results

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prospective-grade.yml'
      - 'src/prospective_integrity_rebuild.py'
      - 'src/shadow_integrity_rebuild.py'
      - 'config/prospective_protocol_2026.yml'
      - 'config/orientation_evaluation_protocol_2026.yml'
      - 'config/joint_core_evaluation_protocol_2026.yml'
  schedule:
    # Normal postgame morning rebuilds.
    - cron: '0 12 * * 0,1,2'
    # November Wednesday/Thursday mornings after Tue/Wed midweek slates.
    - cron: '0 12 * 11 3,4'

permissions:
  contents: write

concurrency:
  group: cfb-weather-data-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm CFBD API key
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "ERROR: CFBD_API_KEY is missing."
            exit 1
          fi

      - name: Rebuild official prospective grades and CLV
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m src.prospective_ledger validate-protocol
          python -m src.prospective_integrity_rebuild

      # The two research-only shadow graders still rely on pandas 2.x's
      # permissive bool-into-float assignment behavior. Keep the production
      # ledger on the repository-pinned pandas version above, then isolate the
      # compatibility environment to these non-production evaluators only.
      - name: Use pandas 2.x for research-only shadow graders
        run: pip install --no-deps 'pandas==2.3.3' && pip install 'pytz>=2020.1'

      # Research-only paired evaluators. Failures here cannot block the official ledger.
      - name: Rebuild baseline-vs-orientation shadow evaluation
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m src.shadow_integrity_rebuild orientation

      - name: Rebuild baseline-vs-joint-core shadow evaluation
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python -m src.shadow_integrity_rebuild joint-core

      - name: Commit derived prospective results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/prospective/2026/
          if [ -d outputs/orientation_shadow/2026/evaluation ]; then
            git add outputs/orientation_shadow/2026/evaluation/
          fi
          if [ -d outputs/joint_core_shadow/2026/evaluation ]; then
            git add outputs/joint_core_shadow/2026/evaluation/
          fi
          git commit -m "Rebuild prospective CFB research results" || echo "No prospective changes to commit"
          git pull --rebase origin main
          git push origin main
