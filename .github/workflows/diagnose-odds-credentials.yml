name: Read-only sportsbook API credential diagnostic
on:
  push:
    paths:
      - '.github/workflows/diagnose-odds-credentials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check provider authentication and safe market metadata
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          def call(url, key, params=None):
              if not key: return None, "missing_secret", {}
              query = urllib.parse.urlencode(dict(params or {}, apiKey=key))
              req = urllib.request.Request(url+"?"+query, headers={"User-Agent":"cfb-odds-readonly-diagnostic/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=18) as r:
                      return json.load(r), str(r.status), dict(r.headers)
              except urllib.error.HTTPError as e:
                  return None, str(e.code), {}
              except Exception as e:
                  return None, type(e).__name__, {}
          papi=os.environ.get("ODDSPAPI_API_KEY","").strip()
          odds=os.environ.get("ODDS_API_KEY","").strip()
          data,status,_=call("https://api.oddspapi.io/v4/account",papi)
          print("ODDSPAPI_ACCOUNT_HTTP="+status)
          if status=="200" and isinstance(data,dict):
              subs=data.get("subscriptions") or []
              active=next((s for s in subs if isinstance(s,dict) and s.get("is_active")),None)
              print("ODDSPAPI_ACTIVE_SUBSCRIPTION="+str(active is not None).lower())
              if active:
                  for field in ("request_limit","request_count"):
                      print("ODDSPAPI_"+field.upper()+"="+str(active.get(field,"unknown")))
                  books=active.get("bookmakers") or {}
                  print("ODDSPAPI_BOOKMAKER_COUNT="+str(len(books)))
                  # One bounded FCS fixture call only if quota allows a reserve.
                  try:
                      remaining=int(active.get("request_limit"))-int(active.get("request_count"))
                  except (TypeError,ValueError): remaining=0
                  if remaining>10:
                      fixtures,fs,_=call("https://api.oddspapi.io/v4/fixtures",papi,
                                        {"tournamentId":"27653","statusId":"0","language":"en"})
                      print("ODDSPAPI_FCS_FIXTURES_HTTP="+fs)
                      if fs=="200":
                          records=fixtures if isinstance(fixtures,list) else fixtures.get("fixtures",[]) if isinstance(fixtures,dict) else []
                          print("ODDSPAPI_FCS_FIXTURE_COUNT="+str(len(records)))
                  else: print("ODDSPAPI_FCS_FIXTURES=skipped_quota_reserve")
          data,status,headers=call("https://api.the-odds-api.com/v4/sports",odds)
          print("THE_ODDS_API_SPORTS_HTTP="+status)
          if status=="200":
              for h in ("x-requests-remaining","x-requests-used"):
                  print("THE_ODDS_API_"+h.upper().replace("-","_")+"="+str(headers.get(h,"unknown")))
              sports=data if isinstance(data,list) else []
              print("THE_ODDS_API_NCAAF_LISTED="+str(any(x.get("key")=="americanfootball_ncaaf" for x in sports if isinstance(x,dict))).lower())
              print("THE_ODDS_API_FCS_LISTED="+str(any(x.get("key")=="americanfootball_ncaaf_fcs" for x in sports if isinstance(x,dict))).lower())
          PY

      - name: Probe one live NCAA totals market without exporting quotes
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          key=os.environ.get("ODDSPAPI_API_KEY","").strip()
          if not key:
              print("MARKET_PROBE=missing_secret");raise SystemExit(0)
          def get(path,**params):
              url="https://api.oddspapi.io/v4/"+path+"?"+urllib.parse.urlencode(dict(params,apiKey=key))
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"cfb-odds-readonly-probe/1.0"}),timeout=25) as response:
                      return json.load(response),"200"
              except urllib.error.HTTPError as e:return None,str(e.code)
              except Exception as e:return None,type(e).__name__
          account,status=get("account")
          if status!="200":print("MARKET_PROBE_ACCOUNT="+status);raise SystemExit(0)
          subs=account.get("subscriptions") or []
          sub=next((x for x in subs if isinstance(x,dict) and x.get("is_active")),{})
          try: remaining=int(sub.get("request_limit"))-int(sub.get("request_count"))
          except (TypeError,ValueError):remaining=0
          if remaining<15:print("MARKET_PROBE=skipped_quota_reserve");raise SystemExit(0)
          allowed=sub.get("bookmakers") or {}
          allowed=set(allowed if isinstance(allowed,(list,dict)) else [])
          books=[x for x in ("hardrockbet","bet365","draftkings","betrivers") if x in allowed]
          if not books:print("MARKET_PROBE=no_preferred_books");raise SystemExit(0)
          catalog,ms=get("markets",language="en")
          print("MARKET_CATALOG_HTTP="+ms)
          if ms!="200":raise SystemExit(0)
          odds,os_=get("odds-by-tournaments",tournamentIds="27653",bookmakers=books[0],
                       language="en",verbosity=3,oddsFormat="american")
          print("ODDSPAPI_BULK_ODDS_HTTP="+os_)
          if os_!="200":raise SystemExit(0)
          records=odds if isinstance(odds,list) else next((odds[k] for k in ("data","odds","results") if isinstance(odds,dict) and isinstance(odds.get(k),list)),[])
          catalog_rows=catalog if isinstance(catalog,list) else []
          lookup={str(x.get("marketId")):x for x in catalog_rows if isinstance(x,dict)}
          total_markets=0;priced_sides=0;sample_fields=set();outcome_fields=set()
          for record in records:
              if not isinstance(record,dict):continue
              sample_fields.update(record.keys())
              for book in (record.get("bookmakerOdds") or {}).values():
                  if not isinstance(book,dict):continue
                  for mid,m in (book.get("markets") or {}).items():
                      info=lookup.get(str(mid),{})
                      if str(info.get("marketType","")).lower()!="totals":continue
                      if str(info.get("period","")).lower() not in ("result","fulltime","full_time","game","match"):continue
                      total_markets+=1
                      for side in (m.get("outcomes") or {}).values():
                          if isinstance(side,dict):
                              outcome_fields.update(side.keys())
                              players=side.get("players") or {}
                              for node in (players.values() if isinstance(players,dict) else players if isinstance(players,list) else []):
                                  if isinstance(node,dict) and node.get("price") is not None:priced_sides+=1
          print("ODDSPAPI_ODDS_FIXTURES="+str(len(records)))
          print("ODDSPAPI_FULL_GAME_TOTAL_MARKETS="+str(total_markets))
          print("ODDSPAPI_PRICED_OUTCOME_NODES="+str(priced_sides))
          print("ODDSPAPI_FIXTURE_FIELD_NAMES="+",".join(sorted(sample_fields)))
          print("ODDSPAPI_OUTCOME_FIELD_NAMES="+",".join(sorted(outcome_fields)))
          PY
