name: FCS Weather Attribution Probe

on:
  pull_request:
    paths:
      - 'src/fcs_weather_attribution_probe.py'
      - '.github/workflows/fcs-weather-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Restore latest live training artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fcs-weather-probe
          mkdir -p /tmp/fcs-weather-probe data/processed
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cfb-live-training-data&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -n cfb-live-training-data -D /tmp/fcs-weather-probe
          MODEL_PATH=$(find /tmp/fcs-weather-probe -type f -name modeling_dataset.csv -print -quit)
          cp "$MODEL_PATH" data/processed/modeling_dataset.csv

      - name: Run local weather attribution probe
        run: python -m src.fcs_weather_attribution_probe

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fcs-weather-attribution-401868110
          path: outputs/fcs_weather_attribution_401868110.csv
          if-no-files-found: error
          retention-days: 7
