# Frozen retrospective gust-value run using the validated resumable IFS acquisition.
name: Manual Wind Gust Value Research

on:
  push:
    branches:
      - research/wind-gust-value
    paths:
      - .github/workflows/manual-wind-gust-value-research.yml
  workflow_dispatch:
    inputs:
      note:
        description: Optional retrospective research note
        required: false
        default: ifs-gust-incremental-value

permissions:
  contents: read
  actions: read

concurrency:
  group: wind-gust-value-research
  cancel-in-progress: false

jobs:
  gust-value-research:
    runs-on: ubuntu-latest

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest historical modeling dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_DIR=$(mktemp -d)
          mkdir -p data/processed

          RESEARCH_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/manual-historical-research.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$RESEARCH_RUN_ID" ]; then
            echo "ERROR: No successful historical research run is available."
            exit 1
          fi

          gh run download "$RESEARCH_RUN_ID" -n cfb-weather-totals-research-output -D "$SOURCE_DIR"
          MODEL_PATH=$(find "$SOURCE_DIR" -type f -name modeling_dataset.csv -print -quit)
          if [ -z "$MODEL_PATH" ]; then
            echo "ERROR: modeling_dataset.csv was not found in the historical artifact."
            exit 1
          fi
          cp "$MODEL_PATH" data/processed/modeling_dataset.csv
          test -s data/reference/stadium_locations.csv

      - name: Restore latest validated IFS gust recovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_DIR=$(mktemp -d)

          RECOVERY_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/wind-gust-acquisition-recovery.yml/runs?branch=research%2Fwind-gust-value&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$RECOVERY_RUN_ID" ]; then
            echo "ERROR: No successful IFS gust recovery artifact exists; refusing model run."
            exit 1
          fi

          echo "Restoring validated gust recovery from run ${RECOVERY_RUN_ID}."
          gh run download "$RECOVERY_RUN_ID" -n "wind-gust-recovery-${RECOVERY_RUN_ID}" -D "$SOURCE_DIR"
          GUST_PATH=$(find "$SOURCE_DIR" -type f -name wind_gust_kickoff.csv -print -quit)
          VALIDATION_PATH=$(find "$SOURCE_DIR" -type f -name recovery_validation.csv -print -quit)
          MANIFEST_PATH=$(find "$SOURCE_DIR" -type f -name wind_gust_full_candidate_manifest.csv -print -quit)
          if [ -z "$GUST_PATH" ] || [ -z "$VALIDATION_PATH" ] || [ -z "$MANIFEST_PATH" ]; then
            echo "ERROR: Recovery artifact is missing required data/QC files."
            exit 1
          fi
          cp "$GUST_PATH" data/processed/wind_gust_kickoff.csv
          cp "$VALIDATION_PATH" data/processed/wind_gust_recovery_validation.csv
          cp "$MANIFEST_PATH" data/processed/wind_gust_full_candidate_manifest.csv

          python - <<'PY'
          import pandas as pd

          rows = pd.read_csv('data/processed/wind_gust_kickoff.csv', low_memory=False)
          validation = pd.read_csv('data/processed/wind_gust_recovery_validation.csv')
          manifest = pd.read_csv('data/processed/wind_gust_full_candidate_manifest.csv', low_memory=False)

          if validation.empty:
              raise SystemExit('ERROR: Recovery validation file is empty.')
          v = validation.iloc[0]
          ready = str(v['ready_for_modeling']).strip().lower() in {'true', '1', 'yes'}
          if not ready:
              raise SystemExit('ERROR: Recovery artifact is not marked ready_for_modeling.')
          if float(v['complete_pct_fetchable']) < 0.99:
              raise SystemExit('ERROR: Recovery artifact does not satisfy 99% coverage gate.')
          if int(v['missing_coordinate_games']) != 0:
              raise SystemExit('ERROR: Recovery artifact contains coordinate omissions.')
          if int(v['recovery_attempt_request_failures']) != 0:
              raise SystemExit('ERROR: Final recovery attempt contains request failures.')

          if len(rows) != len(manifest):
              raise SystemExit(
                  f'ERROR: Gust rows {len(rows)} != frozen manifest rows {len(manifest)}.'
              )
          if rows.duplicated(['source_stack', 'game_id']).any():
              raise SystemExit('ERROR: Duplicate source_stack/game_id rows in gust artifact.')
          if set(rows['source_stack'].dropna().astype(str)) != {'ecmwf_ifs'}:
              raise SystemExit('ERROR: Gust artifact contains a non-IFS source stack.')
          if not rows['fetch_status'].eq('ok').all():
              raise SystemExit('ERROR: Gust artifact contains incomplete fetch rows.')

          required_numeric = ['wind_mph', 'wind_direction_degrees', 'gust_mph', 'gust_spread_mph']
          for col in required_numeric:
              if pd.to_numeric(rows[col], errors='coerce').isna().any():
                  raise SystemExit(f'ERROR: Gust artifact contains missing {col}.')

          kickoff = pd.to_datetime(rows['kickoff_utc'], utc=True, errors='coerce')
          if kickoff.isna().any():
              raise SystemExit('ERROR: Gust artifact contains invalid kickoff timestamps.')
          for col in ['wind_valid_time_utc', 'gust_valid_time_utc']:
              valid = pd.to_datetime(rows[col], utc=True, errors='coerce')
              if valid.isna().any():
                  raise SystemExit(f'ERROR: Gust artifact contains invalid {col}.')
              if (valid > kickoff).any():
                  raise SystemExit(f'ERROR: Gust artifact contains future {col}.')
          if (pd.to_numeric(rows['wind_age_minutes'], errors='coerce') > 120).any():
              raise SystemExit('ERROR: Gust artifact contains stale wind data.')
          if (pd.to_numeric(rows['gust_age_minutes'], errors='coerce') > 120).any():
              raise SystemExit('ERROR: Gust artifact contains stale gust data.')

          print(
              f'Validated recovery QC gate before modeling: {len(rows):,}/{len(manifest):,} complete.'
          )
          PY

      - name: Run model integrity self-tests
        run: python -m src.wind_gust_value_selftest

      - name: Run frozen retrospective gust-value ladder
        run: python -m src.wind_gust_value_research

      - name: Enforce research-only output boundary
        run: |
          set -euo pipefail
          test -s outputs/wind_gust_value/incremental_comparisons.csv
          test -s outputs/wind_gust_value/model_summary.csv
          test -s outputs/wind_gust_value/summary.md
          if git status --porcelain -- outputs/weekly_board.csv outputs/weekly_picks.csv outputs/weekly_card.csv | grep -q .; then
            echo "ERROR: Wind-gust research modified live weekly outputs."
            exit 1
          fi
          echo "Research-only boundary verified."

      - name: Print primary evidence
        run: |
          echo "--- incremental comparisons ---"
          cat outputs/wind_gust_value/incremental_comparisons.csv
          echo "--- model summary ---"
          cat outputs/wind_gust_value/model_summary.csv
          echo "--- coverage ---"
          cat outputs/wind_gust_value/coverage.csv

      - name: Upload isolated wind-gust value research artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-gust-value-research-${{ github.run_id }}
          path: outputs/wind_gust_value/
          if-no-files-found: error
          retention-days: 90
