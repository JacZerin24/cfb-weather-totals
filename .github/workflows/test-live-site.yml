name: Validate Live CFB Website

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q src

      - name: Validate live decision logic
        run: |
          python - <<'PY'
          import pandas as pd
          from src.predict_week import classify_row
          from src.fcs_model import classify_division_row
          from src.nws_forecast import _c_to_f, _kph_to_mph
          from src.odds_api_fallback import apply_fcs_odds_fallback, match_odds_event, select_total_market
          from src.oddspapi_fallback import apply_fcs_oddspapi_fallback, match_oddspapi_fixture, select_oddspapi_total

          qualifying = pd.Series({
              'closing_total': 60.0,
              'pred_market_residual': -4.2,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })
          watch = pd.Series({
              'closing_total': 60.0,
              'pred_market_residual': -4.2,
              'nws_status': 'missing_coordinates',
              'start_time_tbd': False,
          })
          no_play = pd.Series({
              'closing_total': 60.0,
              'pred_market_residual': 4.2,
              'nws_status': 'indoor',
              'start_time_tbd': False,
          })
          fcs_qualifying = pd.Series({
              'division_track': 'FCS',
              'closing_total': 60.0,
              'pred_market_residual': -8.0,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })
          fcs_lean = pd.Series({
              'division_track': 'FCS',
              'closing_total': 57.0,
              'pred_market_residual': -6.0,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })
          fcs_no_play = pd.Series({
              'division_track': 'FCS',
              'closing_total': 60.0,
              'pred_market_residual': -3.0,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })

          assert classify_row(qualifying)[0] == 'QUALIFIES'
          assert classify_row(watch)[0] == 'WATCH'
          assert classify_row(no_play)[0] == 'NO PLAY'
          assert classify_division_row(fcs_qualifying)[0] == 'QUALIFIES'
          assert classify_division_row(fcs_lean)[0] == 'LEAN'
          assert classify_division_row(fcs_no_play)[0] == 'NO PLAY'
          assert round(_c_to_f(0), 1) == 32.0
          assert round(_kph_to_mph(16.0934), 1) == 10.0

          odds_fixture = [{
              'id': 'fixture-game',
              'commence_time': '2026-08-27T22:00:00Z',
              'home_team': 'Delaware State Hornets',
              'away_team': 'Stony Brook Seawolves',
              'bookmakers': [
                  {
                      'key': 'draftkings',
                      'title': 'DraftKings',
                      'markets': [{
                          'key': 'totals',
                          'outcomes': [
                              {'name': 'Over', 'price': -110, 'point': 51.5},
                              {'name': 'Under', 'price': -110, 'point': 51.5},
                          ],
                      }],
                  },
                  {
                      'key': 'fanduel',
                      'title': 'FanDuel',
                      'markets': [{
                          'key': 'totals',
                          'outcomes': [
                              {'name': 'Over', 'price': -110, 'point': 52.0},
                              {'name': 'Under', 'price': -110, 'point': 52.0},
                          ],
                      }],
                  },
              ],
          }]
          fcs_game = pd.Series({
              'division_track': 'FCS',
              'home_team': 'Delaware State',
              'away_team': 'Stony Brook',
              'start_date': '2026-08-27T22:00:00Z',
          })
          event, confidence = match_odds_event(fcs_game, odds_fixture)
          assert event is not None and confidence > 0.9
          market = select_total_market(event, ['DraftKings', 'FanDuel'])
          assert market is not None
          assert market['closing_total'] == 51.5
          assert market['line_provider_count'] == 2

          board = pd.DataFrame([{
              'game_id': 1,
              'division_track': 'FCS',
              'home_team': 'Delaware State',
              'away_team': 'Stony Brook',
              'start_date': '2026-08-27T22:00:00Z',
              'closing_total': None,
          }])
          filled, stats = apply_fcs_odds_fallback(board, ['DraftKings', 'FanDuel'], events=odds_fixture)
          assert filled.loc[0, 'closing_total'] == 51.5
          assert filled.loc[0, 'line_source'] == 'The Odds API'
          assert stats['fcs_fallback_filled'] == 1

          # OddsPapi fixture matching allows the participant order to be reversed
          # and handles sportsbook nicknames appended to the CFBD school name.
          op_fixtures = [{
              'fixtureId': 'id1402765300000001',
              'tournamentId': 27653,
              'startTime': '2026-08-27T22:00:00Z',
              'participant1Name': 'Stony Brook Seawolves',
              'participant2Name': 'Delaware State Hornets',
              'hasOdds': True,
          }]
          op_fixture, op_confidence = match_oddspapi_fixture(fcs_game, op_fixtures)
          assert op_fixture is not None and op_confidence > 0.9

          op_catalog = [
              {
                  'marketId': 1484,
                  'marketName': 'Total (incl. overtime)',
                  'marketType': 'totals',
                  'period': 'fulltime',
                  'playerProp': False,
                  'handicap': 49.5,
              },
              {
                  'marketId': 1486,
                  'marketName': 'Total (incl. overtime)',
                  'marketType': 'totals',
                  'period': 'fulltime',
                  'playerProp': False,
                  'handicap': 50.0,
              },
          ]

          def live_market(over_id, under_id):
              return {
                  'marketActive': True,
                  'outcomes': {
                      str(over_id): {'players': {'0': {'active': True, 'price': 1.91}}},
                      str(under_id): {'players': {'0': {'active': True, 'price': 1.91}}},
                  },
              }

          op_odds = [{
              'fixtureId': 'id1402765300000001',
              'tournamentId': 27653,
              'startTime': '2026-08-27T22:00:00Z',
              'hasOdds': True,
              'bookmakerOdds': {
                  'draftkings': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': {
                          '1484': live_market(1484, 1485),
                      },
                  },
                  'fanduel': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': {
                          '1484': live_market(1484, 1485),
                          '1486': live_market(1486, 1487),
                      },
                  },
                  'pinnacle': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': {
                          '1486': live_market(1486, 1487),
                      },
                  },
              },
          }]
          op_market = select_oddspapi_total(op_odds[0], op_catalog, ['DraftKings', 'FanDuel'])
          assert op_market is not None
          assert op_market['closing_total'] == 49.5
          assert op_market['oddspapi_consensus_book_count'] == 2
          assert op_market['line_provider_count'] == 3
          assert op_market['line_source'] == 'OddsPapi'

          op_board = pd.DataFrame([{
              'game_id': 1,
              'division_track': 'FCS',
              'home_team': 'Delaware State',
              'away_team': 'Stony Brook',
              'start_date': '2026-08-27T22:00:00Z',
              'closing_total': None,
          }])
          op_filled, op_stats = apply_fcs_oddspapi_fallback(
              op_board,
              ['DraftKings', 'FanDuel'],
              fixtures=op_fixtures,
              odds_records=op_odds,
              market_catalog=op_catalog,
          )
          assert op_filled.loc[0, 'closing_total'] == 49.5
          assert op_filled.loc[0, 'line_source'] == 'OddsPapi'
          assert op_stats['fcs_oddspapi_filled'] == 1
          print('Live FBS/FCS decision, weather conversion, and both FCS odds fallback checks passed.')
          PY
