name: Validate Live CFB Website

on:
  pull_request:
    paths:
      - 'src/**'
      - 'site_tools/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile production and site source
        run: python -m compileall -q src site_tools

      - name: Validate market cache safety
        run: python -m src.market_line_cache_selftest

      - name: Validate live decision and integration logic
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import numpy as np
          import pandas as pd

          from site_tools.augment_weather_ui import weather_types
          from src.close_capture_gate import candidate_kickoffs, should_capture
          from src.fcs_model import classify_division_row
          from src.model_bakeoff import feature_lists
          from src.nws_forecast import _c_to_f, _kph_to_mph, _value_at
          from src.odds_api_fallback import (
              apply_fbs_odds_fallback,
              apply_fcs_odds_fallback,
              match_odds_event,
              select_total_market,
          )
          from src.oddspapi_fallback import (
              NCAA_BOOKMAKER_PRIORITY,
              _is_full_game_total,
              apply_fcs_oddspapi_fallback,
              match_oddspapi_fixture,
              select_oddspapi_total,
          )
          from src.predict_week import classify_row
          from src.run_live_week import active_cfb_season, calendar_slate_window

          assert NCAA_BOOKMAKER_PRIORITY == ['hardrockbet', 'bet365', 'draftkings', 'betrivers']

          qualifying = pd.Series({
              'closing_total': 60.0,
              'pred_market_residual': -4.2,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })
          watch = pd.Series({
              'closing_total': 60.0,
              'pred_market_residual': -4.2,
              'nws_status': 'missing_coordinates',
              'start_time_tbd': False,
          })
          incomplete = pd.Series({
              'closing_total': 60.0,
              'pred_market_residual': -4.2,
              'nws_status': 'incomplete_forecast',
              'start_time_tbd': False,
          })
          no_play = pd.Series({
              'closing_total': 60.0,
              'pred_market_residual': 4.2,
              'nws_status': 'indoor',
              'start_time_tbd': False,
          })
          fcs_qualifying = pd.Series({
              'division_track': 'FCS',
              'closing_total': 60.0,
              'pred_market_residual': -8.0,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })
          fcs_lean = pd.Series({
              'division_track': 'FCS',
              'closing_total': 57.0,
              'pred_market_residual': -6.0,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })
          fcs_no_play = pd.Series({
              'division_track': 'FCS',
              'closing_total': 60.0,
              'pred_market_residual': -3.0,
              'nws_status': 'ok',
              'start_time_tbd': False,
          })

          assert classify_row(qualifying)[0] == 'QUALIFIES'
          assert classify_row(watch)[0] == 'WATCH'
          assert classify_row(incomplete)[0] == 'WATCH'
          assert classify_row(no_play)[0] == 'NO PLAY'
          assert classify_division_row(fcs_qualifying)[0] == 'QUALIFIES'
          assert classify_division_row(fcs_lean)[0] == 'LEAN'
          assert classify_division_row(fcs_no_play)[0] == 'NO PLAY'
          assert round(_c_to_f(0), 1) == 32.0
          assert round(_kph_to_mph(16.0934), 1) == 10.0

          # NWS nearest-value fallback must not reach arbitrarily far outside
          # the grid's valid kickoff support.
          grid_series = {'values': [{
              'validTime': '2026-09-10T00:00:00Z/PT1H',
              'value': 12.0,
          }]}
          inside = datetime(2026, 9, 10, 0, 30, tzinfo=timezone.utc)
          far = datetime(2026, 9, 10, 10, 0, tzinfo=timezone.utc)
          assert _value_at(grid_series, inside) == 12.0
          assert _value_at(grid_series, far) is None

          # January/February postseason games stay attached to the prior CFB
          # season, and slate selection is based on the actual Central calendar
          # week rather than one possibly stale CFBD week label. The first
          # fixture is deliberately Monday morning Central, not Sunday evening.
          assert active_cfb_season('2026-09-10T00:00:00Z') == 2026
          assert active_cfb_season('2027-01-10T00:00:00Z') == 2026
          slate_fixture = pd.DataFrame({
              'start_date': pd.to_datetime([
                  '2026-09-14T12:00:00Z',
                  '2026-09-17T23:00:00Z',
                  '2026-09-19T23:00:00Z',
              ], utc=True),
              'week': [2, 3, 3],
          })
          start, end = calendar_slate_window(slate_fixture)
          assert start < slate_fixture.iloc[0]['start_date'] < end
          assert (slate_fixture['start_date'] < end).all()
          assert start == pd.Timestamp('2026-09-14T05:00:00Z')
          assert end == pd.Timestamp('2026-09-21T05:00:00Z')

          # 00Z Monday is still Sunday evening CDT and therefore belongs to the
          # previous Central-time week. Keep this explicit so UTC/local boundary
          # mistakes cannot re-enter the slate regression fixture.
          boundary_fixture = pd.DataFrame({
              'start_date': pd.to_datetime(['2026-09-14T00:00:00Z'], utc=True),
          })
          boundary_start, boundary_end = calendar_slate_window(boundary_fixture)
          assert boundary_start == pd.Timestamp('2026-09-07T05:00:00Z')
          assert boundary_end == pd.Timestamp('2026-09-14T05:00:00Z')

          # Close-capture preflight source order is authoritative. A current
          # weekly-board reschedule must override a stale immutable ledger time.
          with TemporaryDirectory() as td:
              root = Path(td)
              board_path = root / 'weekly_board.csv'
              ledger_path = root / 'official_entries.csv'

              pd.DataFrame([{
                  'game_id': 101,
                  'start_date': '2026-09-19T23:00:00Z',
                  'away_team': 'Away',
                  'home_team': 'Home',
              }]).to_csv(board_path, index=False)
              pd.DataFrame([{
                  'game_id': 101,
                  'start_date': '2026-09-20T01:00:00Z',
                  'away_team': 'Away',
                  'home_team': 'Home',
              }]).to_csv(ledger_path, index=False)
              moved_earlier = candidate_kickoffs(
                  now='2026-09-19T21:30:00Z',
                  window_minutes=105,
                  sources=(board_path, ledger_path),
              )
              assert len(moved_earlier) == 1
              assert moved_earlier.iloc[0]['start_date'] == pd.Timestamp('2026-09-19T23:00:00Z')
              assert should_capture(
                  now='2026-09-19T21:30:00Z',
                  window_minutes=105,
                  sources=(board_path, ledger_path),
              )

              pd.DataFrame([{
                  'game_id': 102,
                  'start_date': '2026-09-20T01:30:00Z',
                  'away_team': 'Away2',
                  'home_team': 'Home2',
              }]).to_csv(board_path, index=False)
              pd.DataFrame([{
                  'game_id': 102,
                  'start_date': '2026-09-19T23:00:00Z',
                  'away_team': 'Away2',
                  'home_team': 'Home2',
              }]).to_csv(ledger_path, index=False)
              moved_later = candidate_kickoffs(
                  now='2026-09-19T21:30:00Z',
                  window_minutes=105,
                  sources=(board_path, ledger_path),
              )
              assert moved_later.empty
              assert not should_capture(
                  now='2026-09-19T21:30:00Z',
                  window_minutes=105,
                  sources=(board_path, ledger_path),
              )

          # All-missing historical numeric columns are explicitly excluded
          # instead of being silently dropped by sklearn's imputer.
          feature_fixture = pd.DataFrame({
              'closing_total': [55.0, 56.0],
              'wind_mph': [5.0, 6.0],
              'home_prior_sacks': [np.nan, np.nan],
              'home_prior_points': [24.0, 27.0],
              'game_indoors_bool': [False, False],
          })
          nums, _ = feature_lists(feature_fixture)
          assert 'home_prior_sacks' not in nums
          assert 'home_prior_points' in nums

          assert weather_types({
              'game_indoors': False,
              'temperature_f': 90,
              'wind_mph': 16,
              'wind_gust_mph': 28,
              'precip_probability_pct': 45,
              'precipitation': 0.0,
              'snowfall': 0.0,
          }) == ['RAIN', 'WIND', 'HOT']
          assert weather_types({'game_indoors': True}) == ['INDOOR']

          odds_fixture = [{
              'id': 'fixture-game',
              'commence_time': '2026-08-27T22:00:00Z',
              'home_team': 'Delaware State Hornets',
              'away_team': 'Stony Brook Seawolves',
              'bookmakers': [
                  {
                      'key': 'draftkings',
                      'title': 'DraftKings',
                      'markets': [{
                          'key': 'totals',
                          'outcomes': [
                              {'name': 'Over', 'price': -110, 'point': 51.5},
                              {'name': 'Under', 'price': -110, 'point': 51.5},
                          ],
                      }],
                  },
                  {
                      'key': 'fanduel',
                      'title': 'FanDuel',
                      'markets': [{
                          'key': 'totals',
                          'outcomes': [
                              {'name': 'Over', 'price': -110, 'point': 52.0},
                              {'name': 'Under', 'price': -110, 'point': 52.0},
                          ],
                      }],
                  },
              ],
          }]
          fcs_game = pd.Series({
              'division_track': 'FCS',
              'home_team': 'Delaware State',
              'away_team': 'Stony Brook',
              'start_date': '2026-08-27T22:00:00Z',
          })
          event, confidence = match_odds_event(fcs_game, odds_fixture)
          assert event is not None and confidence > 0.9
          market = select_total_market(event, ['DraftKings', 'FanDuel'])
          assert market is not None
          assert market['closing_total'] == 51.5
          assert market['line_provider_count'] == 2

          board = pd.DataFrame([{
              'game_id': 1,
              'division_track': 'FCS',
              'home_team': 'Delaware State',
              'away_team': 'Stony Brook',
              'start_date': '2026-08-27T22:00:00Z',
              'closing_total': None,
          }])
          filled, stats = apply_fcs_odds_fallback(board, ['DraftKings', 'FanDuel'], events=odds_fixture)
          assert filled.loc[0, 'closing_total'] == 51.5
          assert filled.loc[0, 'line_source'] == 'The Odds API'
          assert stats['fcs_fallback_filled'] == 1

          # FBS fallback is missing-only: primary CFBD market data must never be
          # overwritten, while a genuinely missing FBS-involved total is filled.
          fbs_events = [
              {
                  'id': 'fbs-existing',
                  'commence_time': '2026-09-19T23:30:00Z',
                  'home_team': 'Alabama Crimson Tide',
                  'away_team': 'Georgia Bulldogs',
                  'bookmakers': [{
                      'key': 'draftkings',
                      'title': 'DraftKings',
                      'markets': [{
                          'key': 'totals',
                          'outcomes': [
                              {'name': 'Over', 'price': -110, 'point': 61.0},
                              {'name': 'Under', 'price': -110, 'point': 61.0},
                          ],
                      }],
                  }],
              },
              {
                  'id': 'fbs-missing',
                  'commence_time': '2026-09-20T00:00:00Z',
                  'home_team': 'LSU Tigers',
                  'away_team': 'Florida Gators',
                  'bookmakers': [{
                      'key': 'draftkings',
                      'title': 'DraftKings',
                      'markets': [{
                          'key': 'totals',
                          'outcomes': [
                              {'name': 'Over', 'price': -110, 'point': 57.0},
                              {'name': 'Under', 'price': -110, 'point': 57.0},
                          ],
                      }],
                  }],
              },
          ]
          fbs_board = pd.DataFrame([
              {
                  'game_id': 201,
                  'home_team': 'Alabama',
                  'away_team': 'Georgia',
                  'home_classification': 'fbs',
                  'away_classification': 'fbs',
                  'start_date': '2026-09-19T23:30:00Z',
                  'closing_total': 58.5,
                  'line_source': 'CFBD',
              },
              {
                  'game_id': 202,
                  'home_team': 'LSU',
                  'away_team': 'Florida',
                  'home_classification': 'fbs',
                  'away_classification': 'fbs',
                  'start_date': '2026-09-20T00:00:00Z',
                  'closing_total': None,
                  'line_source': '',
              },
          ])
          fbs_filled, fbs_stats = apply_fbs_odds_fallback(
              fbs_board,
              ['DraftKings'],
              events=fbs_events,
          )
          assert fbs_filled.loc[0, 'closing_total'] == 58.5
          assert fbs_filled.loc[0, 'line_source'] == 'CFBD'
          assert fbs_filled.loc[1, 'closing_total'] == 57.0
          assert fbs_filled.loc[1, 'line_source'] == 'The Odds API'
          assert fbs_stats['fbs_missing_before'] == 1
          assert fbs_stats['fbs_fallback_filled'] == 1
          assert fbs_stats['fbs_missing_after'] == 0

          op_fixtures = [{
              'fixtureId': 'id1402765300000001',
              'tournamentId': 27653,
              'startTime': '2026-08-27T22:00:00Z',
              'participant1Name': 'Stony Brook Seawolves',
              'participant2Name': 'Delaware State Hornets',
              'hasOdds': True,
          }]
          op_fixture, op_confidence = match_oddspapi_fixture(fcs_game, op_fixtures)
          assert op_fixture is not None and op_confidence > 0.9

          op_catalog = [
              {
                  'marketId': 1464,
                  'marketName': 'Total (incl. overtime)',
                  'marketType': 'totals',
                  'period': 'result',
                  'playerProp': False,
                  'handicap': 44.5,
              },
              {
                  'marketId': 1460,
                  'marketName': 'Total (incl. overtime)',
                  'marketType': 'totals',
                  'period': 'result',
                  'playerProp': False,
                  'handicap': 43.5,
              },
          ]

          assert _is_full_game_total(op_catalog[0])
          assert _is_full_game_total({
              'marketName': 'Over Under Full Time',
              'marketType': 'totals',
              'period': 'fulltime',
              'playerProp': False,
              'handicap': 52.5,
          })
          assert not _is_full_game_total({
              'marketName': 'Away Team Total',
              'marketType': 'totals',
              'period': 'result',
              'playerProp': False,
              'handicap': 27.5,
          })

          def live_market(over_id, under_id):
              return {
                  'marketActive': True,
                  'outcomes': {
                      str(over_id): {'players': {'0': {'active': True, 'price': 1.91}}},
                      str(under_id): {'players': {'0': {'active': True, 'price': 1.91}}},
                  },
              }

          def inactive_market(over_id, under_id):
              return {
                  'marketActive': True,
                  'outcomes': {
                      str(over_id): {'players': {'0': {'active': False, 'price': 1.91}}},
                      str(under_id): {'players': {'0': {'active': False, 'price': 1.91}}},
                  },
              }

          op_odds = [{
              'fixtureId': 'id1402765300000001',
              'tournamentId': 27653,
              'startTime': '2026-08-27T22:00:00Z',
              'hasOdds': True,
              'bookmakerOdds': {
                  'draftkings': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': {
                          '1464': live_market(1464, 1465),
                          '1460': inactive_market(1460, 1461),
                      },
                  },
                  'fanduel': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': {
                          '1464': live_market(1464, 1465),
                      },
                  },
              },
          }]
          op_market = select_oddspapi_total(op_odds[0], op_catalog, ['DraftKings', 'FanDuel'])
          assert op_market is not None
          assert op_market['closing_total'] == 44.5
          assert op_market['oddspapi_consensus_book_count'] == 2
          assert op_market['line_provider_count'] == 2
          assert op_market['line_source'] == 'OddsPapi'

          # Alternate-line ladders count as one sportsbook when locating the
          # center; they cannot overwhelm two books quoting a single main total.
          ladder_catalog = []
          hardrock_markets = {}
          for i, line in enumerate([44.5, 45.5, 46.5, 47.5, 48.5, 49.5, 50.5, 51.5, 52.5, 53.5, 54.5]):
              market_id = 2000 + i * 2
              ladder_catalog.append({
                  'marketId': market_id,
                  'marketName': 'Total (incl. overtime)',
                  'marketType': 'totals',
                  'period': 'result',
                  'playerProp': False,
                  'handicap': line,
              })
              hardrock_markets[str(market_id)] = live_market(market_id, market_id + 1)
          main_id = 3000
          ladder_catalog.append({
              'marketId': main_id,
              'marketName': 'Total (incl. overtime)',
              'marketType': 'totals',
              'period': 'result',
              'playerProp': False,
              'handicap': 50.5,
          })
          ladder_odds = {
              'fixtureId': 'ladder-test',
              'bookmakerOdds': {
                  'bet365': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': {str(main_id): live_market(main_id, main_id + 1)},
                  },
                  'draftkings': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': {str(main_id): live_market(main_id, main_id + 1)},
                  },
                  'hardrockbet': {
                      'bookmakerIsActive': True,
                      'suspended': False,
                      'markets': hardrock_markets,
                  },
              },
          }
          ladder_market = select_oddspapi_total(ladder_odds, ladder_catalog)
          assert ladder_market is not None
          assert ladder_market['closing_total'] == 50.5
          assert ladder_market['oddspapi_consensus_book_count'] == 3

          op_board = pd.DataFrame([{
              'game_id': 1,
              'division_track': 'FCS',
              'home_team': 'Delaware State',
              'away_team': 'Stony Brook',
              'start_date': '2026-08-27T22:00:00Z',
              'closing_total': None,
          }])
          op_filled, op_stats = apply_fcs_oddspapi_fallback(
              op_board,
              ['DraftKings', 'FanDuel'],
              fixtures=op_fixtures,
              odds_records=op_odds,
              market_catalog=op_catalog,
          )
          assert op_filled.loc[0, 'closing_total'] == 44.5
          assert op_filled.loc[0, 'line_source'] == 'OddsPapi'
          assert op_stats['fcs_oddspapi_filled'] == 1
          print('Live decision, NWS horizon, Central slate rollover, close-capture precedence, feature-shape, weather UI, and FBS/FCS odds fallback checks passed.')
          PY
