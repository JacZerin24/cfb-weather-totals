name: Wind Gust Data QC Smoke

on:
  push:
    branches:
      - research/wind-gust-value
    paths:
      - src/pull_historical_gusts.py
      - src/wind_gust_data_selftest.py
      - documentation/WIND_GUST_RESEARCH_PROTOCOL.md
      - .github/workflows/wind-gust-data-qc-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wind-gust-data-qc-smoke
  cancel-in-progress: true

jobs:
  smoke-qc:
    runs-on: ubuntu-latest

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest historical modeling dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_DIR=$(mktemp -d)
          mkdir -p data/processed

          RESEARCH_RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/manual-historical-research.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$RESEARCH_RUN_ID" ]; then
            echo "ERROR: No successful historical research run is available."
            exit 1
          fi

          echo "Restoring historical data from run ${RESEARCH_RUN_ID}."
          gh run download "$RESEARCH_RUN_ID" -n cfb-weather-totals-research-output -D "$SOURCE_DIR"
          MODEL_PATH=$(find "$SOURCE_DIR" -type f -name modeling_dataset.csv -print -quit)
          if [ -z "$MODEL_PATH" ]; then
            echo "ERROR: modeling_dataset.csv was not found in the historical artifact."
            exit 1
          fi
          cp "$MODEL_PATH" data/processed/modeling_dataset.csv
          test -s data/reference/stadium_locations.csv

      - name: Build geographically distributed 2022 outdoor FBS pilot
        run: |
          python - <<'PY'
          import pandas as pd

          model_path = 'data/processed/modeling_dataset.csv'
          df = pd.read_csv(model_path, low_memory=False)
          loc = pd.read_csv('data/reference/stadium_locations.csv', low_memory=False)

          for col in ['season', 'venue_id']:
              df[col] = pd.to_numeric(df[col], errors='coerce')
          loc['venue_id'] = pd.to_numeric(loc['venue_id'], errors='coerce')
          loc['venue_latitude'] = pd.to_numeric(loc['venue_latitude'], errors='coerce')
          loc['venue_longitude'] = pd.to_numeric(loc['venue_longitude'], errors='coerce')

          season = df[df['season'].eq(2022)].copy()
          if {'home_classification', 'away_classification'} <= set(season.columns):
              season = season[
                  season['home_classification'].astype(str).str.lower().eq('fbs')
                  & season['away_classification'].astype(str).str.lower().eq('fbs')
              ]
          if 'game_indoors' in season.columns:
              indoor = season['game_indoors'].astype(str).str.lower().isin(['true', '1', 'yes'])
              season = season[~indoor]

          venues = (
              season[['venue_id']]
              .dropna()
              .drop_duplicates()
              .merge(
                  loc[['venue_id', 'venue_latitude', 'venue_longitude']].drop_duplicates('venue_id'),
                  on='venue_id', how='left'
              )
              .dropna(subset=['venue_latitude', 'venue_longitude'])
          )
          if len(venues) < 30:
              raise SystemExit(f'ERROR: Only {len(venues)} eligible pilot venues found.')

          venues['lat_bin'] = pd.qcut(venues['venue_latitude'], q=5, labels=False, duplicates='drop')
          venues['lon_bin'] = pd.qcut(venues['venue_longitude'], q=6, labels=False, duplicates='drop')
          selected = (
              venues.sort_values(['lat_bin', 'lon_bin', 'venue_id'])
              .groupby(['lat_bin', 'lon_bin'], observed=True, as_index=False)
              .first()
          )
          if len(selected) < 20:
              raise SystemExit(f'ERROR: Geographic grid produced only {len(selected)} pilot venues.')

          selected_ids = set(selected['venue_id'])
          pilot = season[season['venue_id'].isin(selected_ids)].copy()
          pilot.to_csv(model_path, index=False)
          selected.to_csv('data/processed/wind_gust_pilot_venues.csv', index=False)
          print(
              f'Pilot contains {len(pilot)} games at {pilot.venue_id.nunique()} venues; '
              f'lat={selected.venue_latitude.min():.2f}..{selected.venue_latitude.max():.2f}, '
              f'lon={selected.venue_longitude.min():.2f}..{selected.venue_longitude.max():.2f}'
          )
          PY

      - name: Run deterministic acquisition and QC self-test
        run: python -m src.wind_gust_data_selftest

      - name: Run same-model ECMWF IFS geographic pilot acquisition
        run: |
          python -m src.pull_historical_gusts \
            --stack ecmwf_ifs \
            --request-delay 0.10 \
            --strict \
            --no-resume

      - name: Require usable wind and gust coverage in pilot
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('data/processed/wind_gust_kickoff.csv', low_memory=False)
          eligible = df[
              df['fetch_status'].isin(['ok', 'partial', 'missing', 'not_fetched'])
              & df['latitude'].notna()
              & df['longitude'].notna()
          ]
          complete = df[df['fetch_status'].eq('ok')]
          if complete.empty:
              raise SystemExit('ERROR: Pilot source returned zero complete wind+gust game rows.')
          coverage = len(complete) / len(eligible) if len(eligible) else 0.0
          if coverage < 0.95:
              raise SystemExit(
                  f'ERROR: Complete wind+gust coverage {coverage:.1%} is below 95% pilot gate.'
              )
          if complete['wind_mph'].notna().sum() == 0 or complete['gust_mph'].notna().sum() == 0:
              raise SystemExit('ERROR: Pilot source did not return usable wind and gust values.')
          print(f'Usable complete pilot rows: {len(complete)} / {len(eligible)} ({coverage:.1%})')
          print(f'Pilot venues represented: {complete.venue_id.nunique()}')
          PY

      - name: Print pilot QC summaries
        if: always()
        run: |
          if [ -s outputs/wind_gust/data_coverage.csv ]; then
            echo "--- data_coverage.csv ---"
            cat outputs/wind_gust/data_coverage.csv
          fi
          if [ -s outputs/wind_gust/qc_summary.csv ]; then
            echo "--- qc_summary.csv ---"
            cat outputs/wind_gust/qc_summary.csv
          fi
          if [ -s outputs/wind_gust/source_comparison.csv ]; then
            echo "--- source_comparison.csv ---"
            cat outputs/wind_gust/source_comparison.csv
          fi
          if [ -s outputs/wind_gust/distribution_summary.csv ]; then
            echo "--- distribution_summary.csv ---"
            cat outputs/wind_gust/distribution_summary.csv
          fi
          if [ -s outputs/wind_gust/request_log.csv ]; then
            echo "--- request_log.csv ---"
            cat outputs/wind_gust/request_log.csv
          fi

      - name: Upload pilot data and QC artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-gust-data-qc-pilot-${{ github.run_id }}
          path: |
            data/processed/wind_gust_kickoff.csv
            data/processed/wind_gust_kickoff_cache.csv
            data/processed/wind_gust_pilot_venues.csv
            outputs/wind_gust/
          if-no-files-found: warn
          retention-days: 30
